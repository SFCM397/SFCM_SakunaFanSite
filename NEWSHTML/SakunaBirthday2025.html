    <h2>　↳🎀🐾結城さくな 誕生日2025</h2>
    <a href="https://x.com/yuki_sakuna/status/1995780836797346027?s=20" target="_blank" >
    <img src="../NEWSIMAGES/結城さくな誕生日2025.jpg" 
    alt="結城さくな 誕生日2025" class="main-image"></a>
    <p>
        2025年12月2日、結城さくな10002歳の誕生日を迎えました。
        <br>配信活動を始めてから、2回目の誕生日を迎えました。
        誕生日配信では、ファンの皆さんからのメッセージやお祝いのコメントで溢れました。
        <br>また配信ではカーディガン、飼い猫の「むちゃお」のお披露目もされました。
        <br>誕生日記念グッズも期間限定で販売されました。
        <br>誕生日配信のアーカイブは、<a href="https://www.youtube.com/live/d6zY22NdVgw?si=0gKqdbFZGTRCJaAq" target="_blank">
            こちら</a>からご覧いただけます。
    </p>
