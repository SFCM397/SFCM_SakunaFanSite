    <h2>　↳🎀🐾ポーカーチェイス × 結城さくな</h2>
    <a href="" target="_blank" >
    <img src="../NEWSIMAGES/PokerCollab.jpg" 
    alt="ポーカーチェイス × 結城さくな" class="main-image"></a>
    <p>
        8月14日、ポーカーチェイスの公式Twitterにて、結城さくなとのコラボが発表されました。
        <br>コラボは8月19日から9月2日までの期間限定のコラボが実施されます。
        <br>また録り下ろしボイスを使用した限定キャラ「結城さくな」がプレイアブルキャラとして登場しました。
        <br>ゲーム内で使える衣装セットや着せ替えアイテムも登場し、コラボを記念したキャンペーンも開催されました。
        <br>詳細は
        <a href="https://x.com/PokerChase_JP?s=20" target="_blank">
            ポーカーチェイス公式X(旧Twitter)</a>や、
        <a href="https://poker-chase.com/event/collaboration_260819/" target="_blank">
            ポーカーチェイス公式サイト</a>をご覧ください。
    </p>
