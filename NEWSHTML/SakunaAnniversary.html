    <h2>　↳🎀🐾結城さくな1st Anniversary</h2>

    <p>
        2025年10月27日で結城さくなは活動1周年を迎えました！
        <br>初配信を行い1年が経ち、
        <a href="../NEWSHTML/SakunaNewVisual.html" target="_blank">
            新ビジュアル</a>にて配信活動を再開しました。
        <br>1周年・新ビジュアル配信は<a href="https://www.youtube.com/live/7Iz7wW1SDHo?si=c3T1Ne_H0AWKeRIY" target="_blank">
            YouTube</a>にて配信されました。
        <br>また、1周年を記念して新ビジュアルのグッズも販売されました。
        <br>現在プチセットの販売は終了していますが、一部のグッズはまだ販売しています。
        <br>今回の新ビジュアルは、ママ<a href="https://twitter.com/komoriehina" target="_blank">
            憂姫はぐれ</a>先生、パパ<a href="https://x.com/rariemonn765" target="_blank">
            rariemon</a>先生に担当していただきました！
    </p>
