        2025年5月26日-2025年6月16日の期間で
        <br>結城さくなとAMICISのコラボデバイスの試遊・展示・販売会が行われました。
        <br>当イベントの池袋「Café\&Bar RAGE ST」では試遊OK！

        <br>等身大パネルやポスターも展示されました。
        <br>詳細には<a href="https://amicis.jp/pages/works/yuuki-sakuna?utm_source=x&utm_medium=amicis&utm_campaign=yuukisakuna">
