    <h2>　↳🎀🐾結城さくなにツインテールが似合うまで初回！</h2>
    <a href="" target="_blank">
    <img src="../NEWSIMAGES/さくまで初回放送.jpg" alt="結城さくなにツインテールが似合うまで初回！"></a>
    <p>
        2025年1月2日、「結城さくなにツインテールが似合うまで」の初回放送が行われました。
        <br>初回は19:30~20:00の30分間、radikoなどで視聴できました。
        <br>月額550円にてアーカイブとおまけコーナー込みでアーカイブ視聴可能です。
        <br>また、2024年3月末まで毎週木曜日の19:30~20:00に放送されていました。
        <br>現在は毎週火曜日の25:30~26:00に放送されています。
        <br>詳しくは<a href="../NEWSHTML/さくまで放送時間変更.html">こちら</a>をご覧ください。
    </p>
