    <p>
        2025年5月16日-5月28日、コラボカフェ
        <br>「おもてにゃしる〜む!!」が大阪と博多で開催されました。
      <br>コラボカフェ大阪・博多会場の「おもてにゃしる〜む!!」は、
      <br>
      <a href="https://maps.app.goo.gl/94gxDJYe8Vffc4Qm8" target="_blank">
        ツリービレッジ大阪店</a>、
      <a href="https://maps.app.goo.gl/Tam6P8jPr2icZ36y6" target="_blank">
        ツリービレッジ博多店</a>にて開催されました。
      <br>当イベントでは、<a href="../NEWSHTML/おもてにゃしる〜む!! 東京.html" target="_blank">東京会場</a>のと同様にカフェメニューの他、グッズが販売されました。
      <br>詳細は<a href="https://x.com/Yuukisakunainfo/status/1910590978232377595" 
      target="_blank">X(旧Twitter)</a>で確認できます。</p>
